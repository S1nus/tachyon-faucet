# Paths are relative to this config file. Keep private data outside the checkout.
devtool = "/home/ubuntu/zcash-devtool/target/release/zcash-devtool"
wallet_dir = "/home/ubuntu/tachyon-faucet-data/wallet"
state_dir = "/home/ubuntu/tachyon-faucet-data/state"
host = "127.0.0.1"
port = 4142
allowed_origins = ["https://tachyscan.cnode.phd"]

amount_zat = 1000000             # 0.01 testnet ZEC per claim; faucet pays fees
cooldown_seconds = 300          # One accepted claim globally every five minutes
auto_shield = true
shield_amount_zat = 100000000    # Refill with 1 ZEC when no spendable note is large enough
poll_seconds = 15
command_timeout = 1800
